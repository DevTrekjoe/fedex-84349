<h2>Create Shipment</h2>
<input id="email" placeholder="Customer Email"><br>
<input id="from" placeholder="From"><br>
<input id="to" placeholder="To"><br>
<input id="estimated" placeholder="Estimated"><br>
<button onclick="create()">Create</button>

<hr>

<h2>Update Shipment</h2>
<input id="track" placeholder="Tracking"><br>
<input id="status" placeholder="Status"><br>
<input id="location" placeholder="Location"><br>
<button onclick="update()">Update</button>

<script>
const API = "https://yourdomain.com/api/";
const TOKEN = "securetoken123";

async function create() {
  const res = await fetch(API+"create.php", {
    method: "POST",
    headers: { "Authorization": TOKEN },
    body: JSON.stringify({
      email: email.value,
      from: from.value,
      to: to.value,
      estimated: estimated.value
    })
  });

  const data = await res.json();
  alert("Tracking: " + data.tracking);
}

async function update() {
  await fetch(API+"update.php", {
    method: "POST",
    headers: { "Authorization": TOKEN },
    body: JSON.stringify({
      tracking: track.value,
      status: status.value,
      location: location.value
    })
  });

  alert("Updated!");
}
</script>
